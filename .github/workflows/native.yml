name: Native desktop checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_packages:
        description: Build and verify portable packages (only when requested)
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    name: ${{ matrix.os }} / Python 3.14
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxcb-cursor0 libxkbcommon-x11-0
      - name: Set up Windows source environment
        if: runner.os == 'Windows'
        run: |
          & ./scripts/setup-windows.ps1 -Python (Get-Command python).Source
          (Join-Path $env:GITHUB_WORKSPACE '.venv/Scripts') | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Set up Linux source environment
        if: runner.os == 'Linux'
        run: |
          sh scripts/setup-linux.sh
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run database, sync and native UI tests
        run: python -m unittest discover -s tests -v
      - name: Build standalone desktop
        if: github.event_name == 'workflow_dispatch' && inputs.build_packages
        run: python -m PyInstaller DayFrame.spec --noconfirm
      - name: Verify packaged app with isolated profile
        if: github.event_name == 'workflow_dispatch' && inputs.build_packages
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            dist/DayFrame/DayFrame.exe --smoke-test --data-dir build/ci-profile --screenshots build/ci-screenshots
          else
            dist/DayFrame/DayFrame --smoke-test --data-dir build/ci-profile --screenshots build/ci-screenshots
          fi
          python -c "import json; from pathlib import Path; report=json.loads(Path('build/ci-screenshots/smoke-report.json').read_text()); assert report['ok'] and len(report['screenshots']) >= 19"
      - name: Upload portable bundle
        if: github.event_name == 'workflow_dispatch' && inputs.build_packages
        uses: actions/upload-artifact@v7
        with:
          name: DayFrame-${{ runner.os }}-${{ github.sha }}
          path: dist/DayFrame
          if-no-files-found: error
          retention-days: 14
      - name: Upload UI smoke evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.build_packages
        uses: actions/upload-artifact@v7
        with:
          name: DayFrame-ui-${{ runner.os }}-${{ github.sha }}
          path: build/ci-screenshots
          if-no-files-found: ignore
          retention-days: 14
