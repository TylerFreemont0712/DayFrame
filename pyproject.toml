[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dayframe-desktop"
version = "0.6.0"
description = "Private native desktop planning, tickets, and time tracking"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "PySide6-Essentials==6.12.0",
    "QtAwesome==1.4.2",
    "keyring==25.7.0",
    "cryptography==50.0.2",
    "tzdata==2026.6",
]

[project.scripts]
dayframe = "dayframe.app:main"
dayframe-hub = "dayframe.sync.hub:main"

[project.urls]
Repository = "https://github.com/TylerFreemont0712/DayFrame"
Issues = "https://github.com/TylerFreemont0712/DayFrame/issues"

[tool.setuptools.packages.find]
include = ["dayframe*"]

[tool.setuptools.package-data]
dayframe = ["resources/*.svg", "resources/*.png"]
"dayframe.data" = ["*.json", "*.sql"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
# Pyflakes plus syntax errors. Import sorting stays off: theme.py must import
# PySide6 before qtawesome so qtpy binds to PySide6.
select = ["E9", "F"]
